name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install a browser for the browser-crawl tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb python3-tk

      - name: Install a browser for the browser-crawl tests (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      # The OASIS schema is not redistributed in this repository, so it is fetched for the SARIF validity test.
      - name: Fetch the SARIF 2.1.0 schema
        shell: bash
        run: curl -fsSL -o tests/fixtures/sarif-schema-2.1.0.json https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json

      - name: Test (Linux, with a virtual display for the window tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests

  code-scanning:
    name: SARIF upload (checks the export against GitHub)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Crawl the repository's own deliberately imperfect demo site: the findings are the point, and nothing outside the runner is touched.
      - name: Scan the demo site
        run: |
          python serve_demo.py &
          sleep 2
          python webcrawler.py http://127.0.0.1:8000/index.html --quick --probe-files --out demo-scan --format sarif --sarif-prefix test-site -q
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo-scan/results.sarif
          category: webcrawler-demo-site
